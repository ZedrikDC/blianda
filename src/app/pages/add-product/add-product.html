<div class="p-8">
  <div class="flex justify-between items-center mb-8">
    <div>
      <div class="text-xs text-gray-400 mb-1 font-semibold tracking-wider">INVENTARIO > NUEVO PRODUCTO</div>
      <h1 class="text-2xl font-bold text-gray-800">Registro de Producto</h1>
    </div>
    <div class="flex gap-3">
      <button class="bg-white border border-gray-200 text-gray-700 px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-50 transition">Cancelar</button>
      <button (click)="saveProduct()" class="bg-teal-700 text-white px-5 py-2.5 rounded-lg hover:bg-teal-800 text-sm font-medium shadow-sm transition">Guardar Producto</button>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-8">
      <div class="bg-white p-7 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-sm font-bold text-gray-800 mb-5 flex items-center gap-2">
          <span class="text-teal-600 bg-teal-50 p-1.5 rounded-md">📋</span> Información Principal
        </h2>
        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Nombre del Producto</label>
          <input type="text" [(ngModel)]="productData.name" placeholder="Ej. Amoxicilina 500mg" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
        </div>
        <div class="grid grid-cols-2 gap-5 mb-5">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Categoría</label>
            <select [(ngModel)]="productData.category" class="w-full border border-gray-200 rounded-lg p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
              <option>Antibióticos</option>
              <option>Suplementos</option>
              <option>Abarrotes</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Código de Barras / SKU</label>
            <input type="text" [(ngModel)]="productData.sku" placeholder="Escanear o escribir código" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-5">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Número de Lote</label>
            <input type="text" [(ngModel)]="productData.batch" placeholder="LOTE-2024-001" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Stock Inicial</label>
            <input type="number" [(ngModel)]="productData.stock" placeholder="0" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Unidad</label>
            <select [(ngModel)]="productData.unit" class="w-full border border-gray-200 rounded-lg p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
              <option>Caja</option>
              <option>Pieza</option>
            </select>
          </div>
        </div>
      </div>

      <div class="bg-white p-7 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-sm font-bold text-gray-800 mb-5 flex items-center gap-2">
          <span class="text-teal-600 bg-teal-50 p-1.5 rounded-md">📅</span> Logística y Caducidad
        </h2>
        <div class="grid grid-cols-2 gap-5">
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Fecha de Fabricación</label>
            <input type="date" [(ngModel)]="productData.mfgDate" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition text-gray-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Fecha de Caducidad</label>
            <input type="date" [(ngModel)]="productData.expDate" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition text-gray-700">
          </div>
        </div>
      </div>
    </div>

    <div class="space-y-8">
      <div class="bg-white p-7 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-sm font-bold text-gray-800 mb-5 flex items-center gap-2">
          <span class="text-teal-600 bg-teal-50 p-1.5 rounded-md">🏢</span> Proveedor
        </h2>
        <div class="mb-5">
          <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Nombre del Proveedor</label>
          <select [(ngModel)]="productData.supplier" class="w-full border border-gray-200 rounded-lg p-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
            <option>Distribuidora Global</option>
            <option>Proveedor Local</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wide">Núm. de Referencia</label>
          <input type="text" [(ngModel)]="productData.refNo" placeholder="REF-XXXXX" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition">
        </div>
      </div>
    </div>
  </div>
</div>
